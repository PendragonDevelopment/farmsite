name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Pinned rather than ubuntu-latest: that label is migrating to Ubuntu 26,
    # and a deploy pipeline should not change OS underneath us unannounced.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Ruby is pinned by .ruby-version (3.4.12) — built here, not on
      # Cloudflare's build image, so the Ruby version is fully under our control.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install

      - name: Build (Bridgetown → output/)
        env:
          BRIDGETOWN_ENV: production
        run: bin/bridgetown deploy

      # Deploys output/ as static assets + functions/ as Pages Functions.
      # D1 binding is read from wrangler.jsonc. No wranglerVersion input:
      # the action picks up the wrangler devDependency installed above, so the
      # deploying version is pinned by package.json rather than by the action.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ecddf441d7f0e3155cea0baaeead86ba
          command: pages deploy output --project-name fhhc-farmsite --branch main
